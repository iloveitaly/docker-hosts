name: Build and Publish to PyPI
on:
  push:
    branches:
      - main
      - master
  pull_request: {}

permissions:
  contents: write

env:
  # avoid build failures due to flaky pypi
  PIP_DEFAULT_TIMEOUT: 60
  PIP_RETRIES: 5

  DATABASE_HOST: localhost
  REDIS_HOST: localhost

  # required otherwise github api calls are rate limited
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # full history so `gitleaks git` in `just lint` can scan every commit
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          bootstrap: true
          bootstrap_args: --update --yes
        env:
          MISE_ENV: ci
      - uses: iloveitaly/github-action-direnv-load-and-mask@master
      - run: uv sync
      - run: just lint

  matrix-test:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14", "3.13", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          bootstrap: true
          bootstrap_args: --update --yes
      # No -g: write the matrix pin into this repo's mise.toml, not ~/.config/mise.
      - run: mise use --path mise.toml python@${{ matrix.python-version }}
      - run: uv venv --clear
      - run: docker compose up -d --wait
      - uses: iloveitaly/github-action-direnv-load-and-mask@master
      - run: uv sync
      - name: Check CLI
        run: uv run ${{ github.event.repository.name }} --help
      - run: uv run pytest

  release-please:
    needs: matrix-test
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: actions/checkout@v5
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: python

  build-and-publish:
    needs: release-please
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out branch instead of detached HEAD so bare git push works
          ref: ${{ github.ref_name }}
      - uses: jdx/mise-action@v4
        with:
          bootstrap: true
          bootstrap_args: --update --yes
      - uses: iloveitaly/github-action-direnv-load-and-mask@master
      - run: uv sync
      - run: uv build
      - run: uv publish

      # Keep uv.lock in sync with pyproject.toml after release version bump without requiring extra config files
      - name: Sync uv.lock
        run: |
          uv lock
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -am "chore(deps): update uv.lock [skip ci]" && git push || true
